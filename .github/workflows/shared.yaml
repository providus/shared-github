name: Build & Deploy

on:
  workflow_call:
    inputs:
      cr-host:
        required: false
        type: string
        default: "docker.io"
        description: "Container registry hostname"
      cr-login:
        required: false
        type: string
        default: "providus"
        description: "Username for container registry"
      build-context:
        required: false
        type: string
        default: "."
        description: "Build context for docker build"
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
        description: "Path to Dockerfile"
      image-name:
        required: true
        type: string
        description: "Name of the image, format quay.io/providus/tenant-service or just providus/tenant-service"
      tag-suffix:
        required: false
        type: string
        default: ""
        description: "Suffix added to the image tag, value of -SEED results in: providus/tenant-service:1.0-abc1234-SEED"
      argocd-host:
        required: true
        type: string
        description: "ArgoCD hostname"
      argocd-version:
        required: false
        type: string
        description: "ArgoCD binary version"
        default: "2.14.11"
      tenant:
        required: true
        type: string
        description: "Tenant name"
      app-name:
        required: true
        type: string
      sonar-host:
        required: false
        type: string
        default: "https://sonarqube.infra.providus.rs/"
        description: "Address of sonar scanner"
      sonar-scanner-version:
        required: false
        type: string
        description: "Version of sonar scanner"
        default: "8.5.0.16571"
      sonar-root:
        required: false
        type: string
        default: "."
        description: "Root directory for sonar scanner"
      env-name:
        required: false
        type: string
        default: "dev"
        description: "Environment name"
      runner-label:
        required: false
        type: string
        default: "ubuntu-24.04"
        description: "Runner name or label where to run"
      debug:
        required: false
        type: boolean
        default: false
      test-report-path:
        required: false
        type: string
        default: ""
        description: "Path to test report files"
      test-report-type:
        required: false
        type: string
        default: ""
        description: "Type of test report files"
      scan-security:
        required: false
        type: string
        description: "Enable image/code vulnerability scanning by selecting threshold level (e.g., HIGH,CRITICAL or MEDIUM,HIGH,CRITICAL)"
      build-args:
        required: false
        type: string
        description: "Additional build arguments for docker build separated by semicolon (;), e.g., ARG1=value1;ARG2=value2"
    secrets:
      cr-pass:
        required: true
        description: "Registry token"
      argocd-token:
        required: true
        description: "ArgoCD token"
      sonar-token:
        required: false
        description: "Sonar token"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      cr-host: ${{ inputs.cr-host }}
      cr-login: ${{ inputs.cr-login }}
      image-name: ${{ inputs.image-name }}
      tag-suffix: ${{ inputs.tag-suffix }}
      build-context: ${{ inputs.build-context }}
      dockerfile: ${{ inputs.dockerfile }}
      app-name: ${{ inputs.app-name }}
      sonar-host: ${{ inputs.sonar-host }}
      sonar-scanner-version: ${{ inputs.sonar-scanner-version }}
      sonar-root: ${{ inputs.sonar-root }}
      env-name: ${{ inputs.env-name }}
      runner-label: ${{ inputs.runner-label }}
      debug: ${{ inputs.debug }}
      test-report-path: ${{ inputs.test-report-path }}
      test-report-type: ${{ inputs.test-report-type }}
      scan-security: ${{ inputs.scan-security }}
      build-args: ${{ inputs.build-args }}
    secrets:
      cr-pass: ${{ secrets.cr-pass }}
      sonar-token: ${{ secrets.sonar-token }}
  deploy:
    uses: ./.github/workflows/deploy.yaml
    needs: build
    with:
      argocd-host: ${{ inputs.argocd-host }}
      argocd-version: ${{ inputs.argocd-version }}
      tenant: ${{ inputs.tenant }}
      app-name: ${{ inputs.app-name }}
      env-name: ${{ inputs.env-name }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      runner-label: ${{ inputs.runner-label }}
      debug: ${{ inputs.debug }}
    secrets:
      argocd-token: ${{ secrets.argocd-token }}
